name: Update index.html

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Commit and push if index.html changed
        run: |
          if [ -z "$(git status --porcelain -- index.html)" ]; then
            echo "index.html unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update index.html"
          git push
